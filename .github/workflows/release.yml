name: Release X-ui
on:
  push:
    tags:
      - 0.*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 三个架构用矩阵构建，产物先作为 workflow artifact 上传
  build:
    name: build x-ui ${{ matrix.arch }} version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            xray_zip: Xray-linux-64.zip
            cross_cc: ''
            cross_pkg: ''
          - arch: arm64
            goarch: arm64
            xray_zip: Xray-linux-arm64-v8a.zip
            cross_cc: aarch64-linux-gnu-gcc
            cross_pkg: gcc-aarch64-linux-gnu
          - arch: s390x
            goarch: s390x
            xray_zip: Xray-linux-s390x.zip
            cross_cc: s390x-linux-gnu-gcc
            cross_pkg: gcc-s390x-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Install cross compiler
        if: matrix.cross_pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_pkg }}
      - name: build linux ${{ matrix.arch }} version
        run: |
          set -euo pipefail
          export GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=1
          if [ -n "${{ matrix.cross_cc }}" ]; then export CC="${{ matrix.cross_cc }}"; fi
          go build -o xui-release -v main.go
          mkdir -p x-ui/bin
          mv xui-release x-ui/x-ui
          cp x-ui.service x-ui/x-ui.service
          cp x-ui.sh x-ui/x-ui.sh
          cd x-ui/bin
          wget https://github.com/XTLS/Xray-core/releases/latest/download/${{ matrix.xray_zip }}
          unzip ${{ matrix.xray_zip }}
          rm -f ${{ matrix.xray_zip }} geoip.dat geosite.dat
          wget https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          mv xray xray-linux-${{ matrix.arch }}
      - name: package
        run: tar -zcvf x-ui-linux-${{ matrix.arch }}.tar.gz x-ui
      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-linux-${{ matrix.arch }}
          path: x-ui-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # 三个架构的产物都构建完成后，统一生成说明并发布：
  # 先建 draft 并附上全部产物，最后才取消 draft，因此 releases/latest
  # （install.sh 用的接口）不会在任何时刻指向一个还没有附件的 release。
  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # 用"上一版已发布的 release → 本次 tag"之间的提交标题自动生成更新日志
      # （本仓库直接提交 main、不走 PR，--generate-notes 只会给一个 compare 链接）
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=RELEASE_NOTES.md
          # 注意：gh api 失败时会把错误 JSON 打到 stdout，所以必须用退出码判断，
          # 不能只靠 "|| true"（否则 404 的 JSON 会被当成变更内容写进说明）
          prev=""
          if out="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
              --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name' 2>/dev/null)"; then
            prev="${out}"
          fi
          changes=""
          if [ -n "${prev}" ] && [ "${prev}" != "${GITHUB_REF_NAME}" ]; then
            if out="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}" \
                --jq '.commits[] | "- " + (.commit.message | split("\n")[0])' 2>/dev/null)"; then
              changes="${out}"
            fi
          fi
          {
            echo "## ${GITHUB_REF_NAME}"
            echo
            echo "### 变更"
            if [ -n "${changes}" ]; then
              printf '%s\n' "${changes}"
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            else
              echo "- 详见提交记录：https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
            fi
          } > "${notes}"
          cat "${notes}"
      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --draft \
            dist/x-ui-linux-*.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
