<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<style>
    .traffic-stat-card {
        text-align: center;
        min-width: 160px;
    }

    .traffic-stat-value {
        font-size: 22px;
        font-weight: 600;
    }

    .traffic-stat-label {
        color: rgba(0, 0, 0, 0.45);
    }

    #realtime-chart,
    #history-chart {
        width: 100%;
        height: 420px;
    }
</style>
<body>
<a-layout id="app" v-cloak>
    {{ template "commonSider" . }}
    <a-layout id="content-layout">
        <a-layout-content>
            <a-spin :spinning="spinning" :delay="500" tip="loading">
                <a-space direction="vertical" style="width: 100%">

                    <a-card title="实时速率(每 10 秒刷新,展示最近 30 分钟)">
                        <a-row type="flex" :gutter="16" justify="space-around" style="margin-bottom: 12px">
                            <a-col class="traffic-stat-card">
                                <div class="traffic-stat-label">整机上行</div>
                                <div class="traffic-stat-value">[[ fmtSpeed(currentUp) ]]</div>
                            </a-col>
                            <a-col class="traffic-stat-card">
                                <div class="traffic-stat-label">整机下行</div>
                                <div class="traffic-stat-value">[[ fmtSpeed(currentDown) ]]</div>
                            </a-col>
                        </a-row>
                        <div id="realtime-chart"></div>
                    </a-card>

                    <a-card title="历史流量">
                        <a-space style="margin-bottom: 12px">
                            <a-radio-group v-model="range" @change="onConditionChange" button-style="solid">
                                <a-radio-button value="24h">24小时</a-radio-button>
                                <a-radio-button value="7d">7天</a-radio-button>
                                <a-radio-button value="15d">15天</a-radio-button>
                            </a-radio-group>
                            <a-radio-group v-model="granularity" @change="onConditionChange" button-style="solid"
                                           :disabled="range === '24h'">
                                <a-radio-button value="hour">小时曲线</a-radio-button>
                                <a-radio-button value="day">按天汇总</a-radio-button>
                            </a-radio-group>
                            <a-select v-model="nodeFilter" style="min-width: 180px" @change="renderHistory">
                                <a-select-option value="all">全部节点</a-select-option>
                                <a-select-option v-for="node in historyNodes" :key="node.tag" :value="node.tag">
                                    [[ nodeName(node) ]]
                                </a-select-option>
                            </a-select>
                        </a-space>
                        <div id="history-chart"></div>
                    </a-card>

                </a-space>
            </a-spin>
        </a-layout-content>
    </a-layout>
</a-layout>
{{template "js" .}}
<script src="{{ .base_path }}assets/echarts@5.5.1/echarts.min.js"></script>
<script>

    const app = new Vue({
        delimiters: ['[[', ']]'],
        el: '#app',
        data: {
            siderDrawer,
            spinning: false,
            currentUp: 0,
            currentDown: 0,
            range: '7d',
            granularity: 'day',
            nodeFilter: 'all',
            historyNodes: [],
            historyData: null,
            realtimeChart: null,
            historyChart: null,
        },
        methods: {
            loading(spinning = true) {
                this.spinning = spinning;
            },
            fmtSpeed(bytes) {
                return sizeFormat(bytes || 0) + '/s';
            },
            fmtBytes(bytes) {
                return sizeFormat(bytes || 0);
            },
            nodeName(node) {
                if (node.remark) {
                    return node.remark + '(' + node.port + ')';
                }
                return node.tag;
            },
            handleResize() {
                if (this.realtimeChart) {
                    this.realtimeChart.resize();
                }
                if (this.historyChart) {
                    this.historyChart.resize();
                }
            },
            async loadRealtime() {
                const msg = await HttpUtil.post('/xui/traffic/realtime');
                if (!msg.success) {
                    return;
                }
                const result = msg.obj || {};
                const samples = result.samples || [];
                // tag -> 节点展示名称(备注(端口)),映射缺失时退回 tag
                const nodeNames = {};
                for (const n of (result.nodes || [])) {
                    nodeNames[n.tag] = this.nodeName(n);
                }
                if (samples.length > 0) {
                    const last = samples[samples.length - 1];
                    this.currentUp = last.up;
                    this.currentDown = last.down;
                }
                const times = [];
                const totalUp = [];
                const totalDown = [];
                const nodeUps = {};
                const nodeDowns = {};
                for (const s of samples) {
                    times.push(moment(s.time * 1000).format('HH:mm:ss'));
                    totalUp.push(s.up);
                    totalDown.push(s.down);
                    for (const tag in s.nodes) {
                        if (!nodeUps[tag]) {
                            // 中途新出现的节点需要先补零对齐时间轴,再追加当前值
                            nodeUps[tag] = new Array(times.length - 1).fill(0);
                            nodeDowns[tag] = new Array(times.length - 1).fill(0);
                        }
                    }
                    for (const tag in nodeUps) {
                        const n = s.nodes[tag];
                        nodeUps[tag].push(n ? n.up : 0);
                        nodeDowns[tag].push(n ? n.down : 0);
                    }
                }
                const series = [
                    {name: '整机上行', type: 'line', showSymbol: false, data: totalUp, lineStyle: {width: 2.5}},
                    {name: '整机下行', type: 'line', showSymbol: false, data: totalDown, lineStyle: {width: 2.5}},
                ];
                for (const tag in nodeUps) {
                    const label = nodeNames[tag] || tag;
                    series.push({name: label + ' ↑', type: 'line', showSymbol: false, data: nodeUps[tag], lineStyle: {width: 1}});
                    series.push({name: label + ' ↓', type: 'line', showSymbol: false, data: nodeDowns[tag], lineStyle: {width: 1}});
                }
                this.realtimeChart.setOption({
                    animation: false,
                    tooltip: {
                        trigger: 'axis',
                        valueFormatter: (value) => this.fmtSpeed(value),
                    },
                    legend: {type: 'scroll'},
                    grid: {left: 70, right: 24, top: 40, bottom: 40},
                    xAxis: {type: 'category', data: times},
                    yAxis: {
                        type: 'value',
                        axisLabel: {formatter: (value) => this.fmtSpeed(value)},
                    },
                    series: series,
                });
            },
            onConditionChange() {
                if (this.range === '24h') {
                    this.granularity = 'hour';
                }
                this.loadHistory();
            },
            async loadHistory() {
                this.loading(true);
                try {
                    const now = Math.floor(Date.now() / 1000);
                    const seconds = this.range === '24h' ? 86400 : (this.range === '7d' ? 7 * 86400 : 15 * 86400);
                    const msg = await HttpUtil.post('/xui/traffic/history', {
                        start: now - seconds,
                        end: now,
                        granularity: this.granularity,
                    });
                    if (msg.success) {
                        this.historyData = msg.obj;
                        this.historyNodes = (msg.obj && msg.obj.nodes) || [];
                        this.renderHistory();
                    }
                } finally {
                    this.loading(false);
                }
            },
            renderHistory() {
                const data = this.historyData;
                if (!data) {
                    return;
                }
                const nodes = this.nodeFilter === 'all'
                    ? this.historyNodes
                    : this.historyNodes.filter((n) => n.tag === this.nodeFilter);
                const granularity = data.granularity;
                const fmtTime = (sec) => {
                    const m = moment(sec * 1000);
                    return granularity === 'day' ? m.format('MM-DD') : m.format('MM-DD HH:00');
                };

                let series;
                if (granularity === 'day') {
                    // 按天:上行/下行两根堆叠柱,每节点一层
                    series = [];
                    for (const node of nodes) {
                        series.push({
                            name: this.nodeName(node) + ' ↑',
                            type: 'bar',
                            stack: 'up',
                            data: node.points.map((p) => p.up),
                        });
                        series.push({
                            name: this.nodeName(node) + ' ↓',
                            type: 'bar',
                            stack: 'down',
                            data: node.points.map((p) => p.down),
                        });
                    }
                } else {
                    // 小时曲线:整机上/下行 + 各节点合计
                    series = [
                        {
                            name: '整机上行', type: 'line', showSymbol: false,
                            data: data.total.map((p) => p.up), lineStyle: {width: 2.5},
                        },
                        {
                            name: '整机下行', type: 'line', showSymbol: false,
                            data: data.total.map((p) => p.down), lineStyle: {width: 2.5},
                        },
                    ];
                    for (const node of nodes) {
                        series.push({
                            name: this.nodeName(node) + ' 合计', type: 'line', showSymbol: false,
                            data: node.points.map((p) => p.up + p.down), lineStyle: {width: 1},
                        });
                    }
                }

                const times = data.total.map((p) => fmtTime(p.time));
                this.historyChart.setOption({
                    animation: false,
                    tooltip: {
                        trigger: 'axis',
                        valueFormatter: (value) => this.fmtBytes(value),
                    },
                    legend: {type: 'scroll'},
                    grid: {left: 70, right: 24, top: 40, bottom: 40},
                    xAxis: {type: 'category', data: times},
                    yAxis: {
                        type: 'value',
                        axisLabel: {formatter: (value) => this.fmtBytes(value)},
                    },
                    series: series,
                }, true);
            },
        },
        async mounted() {
            this.realtimeChart = echarts.init(document.getElementById('realtime-chart'));
            this.historyChart = echarts.init(document.getElementById('history-chart'));
            window.addEventListener('resize', this.handleResize);
            this.loadHistory();
            while (true) {
                await this.loadRealtime();
                await PromiseUtil.sleep(10000);
            }
        },
    });

</script>
</body>
</html>
